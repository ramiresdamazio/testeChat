<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Impakt Chat | Alpha</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background Orbs for Aesthetic -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="app">
      <!-- AUTHENTICATION SCREEN -->
      <div id="auth-screen" class="glass-container visible">
        <div class="auth-header">
          <h2>Dorime Chat</h2>
          <p>Macaquisse Liberada.</p>
        </div>

        <div class="tabs">
          <button id="tab-login" class="active">Entrar</button>
          <button id="tab-register">Cadastrar</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="form-container visible">
          <div class="input-group">
            <label>Email</label>
            <input
              type="email"
              id="login-email"
              placeholder="voce@email.com"
              required
            />
          </div>
          <div class="input-group">
            <label>Senha</label>
            <input
              type="password"
              id="login-password"
              placeholder="••••••••"
              required
            />
          </div>
          <button type="submit" class="btn-primary">Acessar</button>
          <div class="error-msg" id="login-error"></div>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="form-container">
          <div class="input-group">
            <label>Nome ou Nickname</label>
            <input type="text" id="reg-name" placeholder="Dev Ninja" required />
          </div>
          <div class="input-group">
            <label>Email</label>
            <input
              type="email"
              id="reg-email"
              placeholder="voce@email.com"
              required
            />
          </div>
          <div class="input-group">
            <label>Senha</label>
            <input
              type="password"
              id="reg-password"
              placeholder="••••••••"
              required
            />
          </div>
          <button type="submit" class="btn-primary">Criar Conta</button>
          <div class="error-msg" id="reg-error"></div>
        </form>
      </div>

      <!-- CHAT SCREEN -->
      <div id="chat-screen" class="glass-container hidden">
        <!-- SIDEBAR -->
        <div class="chat-sidebar">
          <div class="sidebar-header">
            <h3>Online (<span id="online-count">0</span>)</h3>
            <button
              id="mobile-sidebar-close"
              class="btn-icon mobile-only"
              title="Fechar"
            >
              ❌
            </button>
          </div>
          <div class="online-users-list" id="online-users-list">
            <!-- Dynamic users will appear here -->
          </div>
          <div class="theme-selector">
            <span
              style="
                font-size: 11px;
                color: var(--text-secondary);
                margin-bottom: 8px;
                display: block;
              "
              >TEMAS:</span
            >
            <div style="display: flex; gap: 8px">
              <button
                class="btn-theme"
                onclick="setTheme('default')"
                style="background: #58a6ff"
                title="Padrão"
              ></button>
              <button
                class="btn-theme"
                onclick="setTheme('miku')"
                style="background: #39c5bb"
                title="Miku"
              ></button>
              <button
                class="btn-theme"
                onclick="setTheme('zerotwo')"
                style="background: #d82b2b"
                title="Zero Two"
              ></button>
            </div>
          </div>

          <div class="sidebar-footer">
            <div class="user-info"></div>
            <button id="logout-btn" class="btn-logout-text" title="Sair">
              Sair
            </button>
          </div>
        </div>

        <!-- MAIN CHAT AREA -->
        <div class="chat-main">
          <div class="chat-header">
            <button
              id="mobile-sidebar-toggle"
              class="btn-icon mobile-only"
              title="Ver Usuários"
            >
              👥
            </button>
            <h2>🌍 Sala Global</h2>
          </div>

          <div class="chat-messages" id="messages-container">
            <!-- Messages will be injected here -->
            <div class="system-msg">Boas-vindas ao Ramires Chat!</div>
          </div>

          <!-- Botão Ir para o Fim (Floating) -->
          <button
            id="scroll-to-bottom"
            class="scroll-to-bottom hidden"
            title="Ir para as mensagens recentes"
          >
            <span>↓</span>
            <div id="scroll-badge" class="scroll-badge hidden">0</div>
          </button>

          <!-- GIF Picker (Hidden by default) -->
          <div id="gif-picker" class="gif-picker hidden">
            <input
              type="text"
              id="gif-search"
              placeholder="Buscar GIFs..."
              autocomplete="off"
            />
            <div id="gif-results" class="gif-results"></div>
          </div>

          <!-- Mention Suggestions (Hidden by default) -->
          <div
            id="mention-suggestions"
            class="mention-suggestions hidden"
          ></div>

          <!-- Reply Preview (Hidden by default) -->
          <div id="reply-preview" class="reply-preview hidden">
            <div class="reply-info">
              <span id="reply-user" style="font-weight: bold; font-size: 13px"
                >Nome</span
              >
              <span
                id="reply-text"
                style="
                  font-size: 12px;
                  opacity: 0.8;
                  white-space: nowrap;
                  overflow: hidden;
                  text-overflow: ellipsis;
                "
                >Msg...</span
              >
            </div>
            <button
              type="button"
              onclick="cancelReply()"
              class="btn-icon"
              style="font-size: 12px"
            >
              ❌
            </button>
          </div>

          <!-- Typing Indicator (Hidden by default) -->
          <div id="typing-indicator" class="typing-indicator hidden"></div>

          <!-- Image Lightbox Modal -->
          <div
            id="image-lightbox"
            class="lightbox hidden"
            onclick="this.classList.add('hidden')"
          >
            <img id="lightbox-img" src="" alt="Full Screen" />
          </div>

          <form id="chat-form" class="chat-input-area">
            <div class="attach-wrapper">
              <button
                type="button"
                id="attach-trigger"
                class="btn-icon"
                title="Anexar"
              >
                <span>➕</span>
              </button>
              <div id="attach-menu" class="attach-menu hidden">
                <button
                  type="button"
                  id="btn-gif"
                  class="btn-attach-item"
                  title="Enviar GIF"
                >
                  <span class="icon-gif">GIF</span>
                </button>
                <label
                  for="image-input"
                  class="btn-attach-item"
                  title="Enviar Imagem"
                >
                  <span class="icon-camera">📷</span>
                </label>
              </div>
            </div>
            <input
              type="file"
              id="image-input"
              accept="image/*"
              style="display: none"
            />
            <input
              type="text"
              id="message-input"
              placeholder="Escreva sua mensagem..."
              autocomplete="off"
            />
            <button type="submit" class="btn-send">
              <svg
                viewBox="0 0 24 24"
                width="24"
                height="24"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
  </body>
</html>
